<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Barkod tarayıcı kontrolü</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; max-width: 42rem; }
  .ok { color: #1a7f37; font-weight: 700; }
  .fail { color: #b42318; font-weight: 700; }
  dt { font-weight: 600; margin-top: .6rem; }
  dd { margin: 0; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<h1>Barkod tarayıcı kontrolü</h1>
<p id="verdict">Çalışıyor…</p>
<dl id="facts"></dl>
<canvas id="barcode" hidden></canvas>

<script type="module">
// app.js'teki yedek tarayıcıyla AYNI kurulum: cihazda BarcodeDetector yoksa
// (Safari/iPad) uygulama bu yolu kullanır. Bu sayfa iPad'de açılıp PASS verirse
// canlı tarama yolu sağlam demektir. app.js'teki import/reader satırları
// değişirse burayı da güncelle.
const facts = (k, v) => {
  const dt = document.createElement("dt"); dt.textContent = k;
  const dd = document.createElement("dd"); dd.textContent = String(v);
  document.getElementById("facts").append(dt, dd);
};
const verdict = document.getElementById("verdict");
let pass = true;
const check = (k, ok, v) => { facts(k, v); if (!ok) pass = false; };

check("HTTPS (secure context)", window.isSecureContext, window.isSecureContext);
check("Kamera API (getUserMedia)", !!navigator.mediaDevices?.getUserMedia, !!navigator.mediaDevices?.getUserMedia);
check("BarcodeDetector (iOS'ta yok, normal)", "BarcodeDetector" in window, "BarcodeDetector" in window ? "var" : "yok → ZXing yedeği kullanılır");

try {
  const ZX = await import("https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm");
  const reader = new ZX.BrowserMultiFormatOneDReader();
  check("ZXing yüklendi + okuyucu kuruldu", true, "OK");

  // Gerçek kamera karesi taklidi: 1920x1080 karede ortada EAN-13.
  const L = {0:"0001101",1:"0011001",2:"0010011",3:"0111101",4:"0100011",5:"0110001",6:"0101111",7:"0111011",8:"0110111",9:"0001011"};
  const G = {0:"0100111",1:"0110011",2:"0011011",3:"0100001",4:"0011101",5:"0111001",6:"0000101",7:"0010001",8:"0001001",9:"0010111"};
  const R = {0:"1110010",1:"1100110",2:"1101100",3:"1000010",4:"1011100",5:"1001110",6:"1010000",7:"1000100",8:"1001000",9:"1110100"};
  const PAR = ["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
  const digits = "9780306406157", par = PAR[+digits[0]];
  let bits = "101";
  for (let i = 1; i <= 6; i++) bits += ((par[i - 1] === "L") ? L : G)[digits[i]];
  bits += "01010";
  for (let i = 7; i <= 12; i++) bits += R[digits[i]];
  bits += "101";
  const VW = 1920, VH = 1080, canvas = document.getElementById("barcode");
  canvas.width = VW; canvas.height = VH;
  const ctx = canvas.getContext("2d");
  const draw = () => {
    const modW = 6, bw = bits.length * modW, ox = Math.round((VW - bw) / 2), oy = Math.round(VH * 0.3), bh = Math.round(VH * 0.4);
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = "#000";
    for (let i = 0; i < bits.length; i++) if (bits[i] === "1") ctx.fillRect(ox + i * modW, oy, modW, bh);
  };
  draw(); const repaint = setInterval(draw, 100);
  const video = document.createElement("video");
  video.muted = true; video.playsInline = true; video.width = 320;
  video.style.cssText = "width:320px;background:#111";
  document.body.appendChild(video);
  video.srcObject = canvas.captureStream(30);
  await video.play();

  // app.js'teki startZxingScan döngüsünün AYNISI (ROI kırpma + 800px + 100 ms tick).
  const cv = document.createElement("canvas");
  const cx = cv.getContext("2d", { willReadFrequently: true });
  const t0 = performance.now();
  let tries = 0, decoded = null;
  while (performance.now() - t0 < 5000) {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (vw && vh) {
      await new Promise((r) => setTimeout(r, 100)); // tick beklemesi
      tries++;
      const sw = Math.round(vw * 0.8), sh = Math.round(vh * 0.8);
      const dw = Math.min(800, sw), dh = Math.round((dw * sh) / sw);
      if (cv.width !== dw || cv.height !== dh) { cv.width = dw; cv.height = dh; }
      cx.drawImage(video, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, dw, dh);
      try { const res = reader.decodeFromCanvas(cv); if (res) { decoded = res.getText(); break; } } catch { /* barkod yok */ }
    } else {
      await new Promise((r) => setTimeout(r, 50));
    }
  }
  clearInterval(repaint);
  try { reader.reset(); } catch { /* yoksay */ }
  const ms = Math.round(performance.now() - t0);
  check("EAN-13 çözüldü", decoded === digits, (decoded ?? "okunamadı") + " (beklenen " + digits + ")");
  facts("Tanıma süresi", ms + " ms · " + tries + " deneme (uygulamadakiyle aynı döngü)");
  check("Tanıma hızı < 500 ms", ms < 500, ms + " ms");
} catch (e) {
  check("ZXing yüklendi + okuyucu kuruldu", false, e.name + ": " + e.message);
}

verdict.textContent = pass ? "PASS — tarama yolu bu cihazda çalışıyor." : "FAIL — yukarıdaki satıra bak.";
verdict.className = pass ? "ok" : "fail";
</script>
</body>
</html>
