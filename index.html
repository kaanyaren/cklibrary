<!doctype html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="CK Kütüphanesi — aile kitaplığının ortak fiş kataloğu." />
  <meta name="theme-color" content="#7c2d2c" />
  <script>
    try {
      var t = localStorage.getItem("ck-theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <title>CK Kütüphanesi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Taviraj:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20261014c" />
</head>
<body>
  <noscript>
    <p class="noscript">CK Kütüphanesi'nin çalışması için JavaScript gerekli.</p>
  </noscript>

  <!-- ───────────── GİRİŞ ───────────── -->
  <main id="login-view" class="login" hidden>
    <div class="login-panel">
      <p class="login-eyebrow">Aile rafı — kimin elinden ne geçmiş, tek fişte.</p>
      <h1 class="wordmark">CK Kütüphanesi</h1>
      <p class="login-sub">Aile kitaplığının ortak kataloğu. Kim giriş yapıyor?</p>

      <div class="who" role="radiogroup" aria-label="Kullanıcı seçimi">
        <button type="button" class="who-btn" data-email="ceyda.d@gmail.com" aria-pressed="false">
          <span class="who-name">ceyda</span>
          <span class="who-role">düzenleyici</span>
        </button>
        <button type="button" class="who-btn" data-email="kaanyaren@gmail.com" aria-pressed="false">
          <span class="who-name">kaan</span>
          <span class="who-role">düzenleyici</span>
        </button>
        <button type="button" class="who-btn" data-email="lenayaren@gmail.com" aria-pressed="false">
          <span class="who-name">lena</span>
          <span class="who-role">ekleyici</span>
        </button>
      </div>

      <form id="login-form" class="login-form" novalidate>
        <label class="field">
          <span class="field-label">Şifre</span>
          <input id="password" type="password" name="password" autocomplete="current-password"
                 placeholder="••••••••" required aria-describedby="login-error" />
        </label>
        <button type="submit" id="login-submit" class="btn btn-primary btn-block">Giriş yap</button>
        <p id="login-error" class="form-error" role="alert" aria-live="assertive" hidden></p>
      </form>
    </div>
  </main>

  <!-- ───────────── UYGULAMA ───────────── -->
  <div id="app-view" hidden>
    <header class="topbar">
      <p class="welcome" id="welcome" aria-live="polite"></p>
      <div class="topbar-right">
        <p class="user-chip">
          <span id="user-role" class="user-role"></span>
        </p>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false" aria-label="Koyu temaya geç"><svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        <button type="button" id="logout" class="btn btn-ghost">Çıkış</button>
      </div>
    </header>

    <section class="toolbar" aria-label="Arama ve filtreler">
      <div class="search-wrap">
        <label class="visually-hidden" for="search">Ara</label>
        <input id="search" type="search" class="search" placeholder="Başlık, yazar veya yayınevi ara…"
               autocomplete="off" spellcheck="false" />
      </div>
      <div class="toolbar-actions">
        <button type="button" id="find-covers" class="btn btn-ghost btn-tiny" hidden>Tüm Kapakları Bul</button>
        <button type="button" id="add-book" class="btn btn-primary add-btn">Kitap ekle</button>
      </div>
      <div class="filters" role="group" aria-label="Filtreler">
        <button type="button" class="chip is-active" data-filter="all">Tümü</button>
        <button type="button" class="chip" data-filter="rated">Puanlanan</button>
        <button type="button" class="chip" data-filter="unrated">Puanlanmayan</button>
        <button type="button" class="chip" data-filter="mine">Eklediklerim</button>
        <button type="button" class="chip" data-filter="read">Okuduklarım</button>
        <button type="button" class="chip" data-filter="unread">Okumadıklarım</button>
      </div>
    </section>

    <p class="shelf-kicker">Katalog</p>
    <p id="shelf-status" class="shelf-status" aria-live="polite"></p>
    <main id="shelf" class="shelf" aria-label="Kitap listesi"></main>
    <p id="shelf-error" class="load-error" role="alert" hidden></p>
  </div>

  <!-- ───────────── DETAY ───────────── -->
  <dialog id="detail-dialog" class="sheet" aria-labelledby="detail-title">
    <div id="detail-body" class="detail-body"></div>
  </dialog>

  <!-- ───────────── EKLE / DÜZENLE ───────────── -->
  <dialog id="form-dialog" class="sheet sheet-form" aria-labelledby="form-title">
    <form id="book-form" class="book-form" novalidate>
      <h2 id="form-title" class="sheet-title">Kitap ekle</h2>

      <button type="button" id="scan-btn" class="btn btn-ghost btn-block">Barkod tara</button>
      <p id="form-note" class="form-note" role="status" hidden></p>

      <label class="field">
        <span class="field-label">Başlık <em class="req">zorunlu</em></span>
        <input id="f-title" name="title" type="text" required autocomplete="off" />
      </label>

      <div class="field-row">
        <label class="field">
          <span class="field-label">Yazar / katkıda bulunanlar</span>
          <input id="f-creators" name="creators" type="text" autocomplete="off" />
        </label>
        <label class="field">
          <span class="field-label">Yayınevi</span>
          <input id="f-publisher" name="publisher" type="text" autocomplete="off" />
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span class="field-label">Yayın tarihi</span>
          <input id="f-date" name="publish_date" type="text" placeholder="2019" autocomplete="off" />
        </label>
        <label class="field">
          <span class="field-label">Sayfa</span>
          <input id="f-pages" name="pages" type="number" min="0" step="1" inputmode="numeric" />
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span class="field-label">ISBN-13</span>
          <input id="f-isbn13" name="isbn13" type="text" autocomplete="off" />
        </label>
        <label class="field">
          <span class="field-label">ISBN-10</span>
          <input id="f-isbn10" name="isbn10" type="text" autocomplete="off" />
        </label>
      </div>

      <label class="field">
        <span class="field-label">Açıklama</span>
        <textarea id="f-description" name="description" rows="3"></textarea>
      </label>

      <p id="form-error" class="form-error" role="alert" hidden></p>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" data-close-form>Vazgeç</button>
        <button type="submit" id="form-submit" class="btn btn-primary">Kaydet</button>
      </div>
    </form>
  </dialog>

  <!-- ───────────── BARKOD TARAMA ───────────── -->
  <dialog id="scan-dialog" class="sheet sheet-scan" aria-labelledby="scan-title">
    <div class="scan-body">
      <div class="detail-top">
        <h2 id="scan-title" class="sheet-title">Barkod tara</h2>
        <button type="button" class="detail-close" data-close-scan>Kapat</button>
      </div>
      <div class="scan-frame">
        <video id="scan-video" playsinline muted></video>
      </div>
      <p id="scan-status" class="scan-status" role="status">Kamera açılıyor…</p>
    </div>
  </dialog>

  <!-- ───────────── KAPAK ÖNERİLERİ ───────────── -->
  <dialog id="covers-dialog" class="sheet" aria-labelledby="covers-title">
    <div class="scan-body">
      <div class="detail-top">
        <h2 id="covers-title" class="sheet-title">Kapak önerileri</h2>
        <button type="button" class="detail-close" data-close-covers>Kapat</button>
      </div>
      <p id="covers-status" class="scan-status" role="status">Hazırlanıyor…</p>
      <div id="covers-body" class="covers-body"></div>
      <div class="form-actions covers-actions">
        <label class="cover-all"><input type="checkbox" id="covers-select-all" checked disabled /> Tümünü seç</label>
        <button type="button" id="covers-apply" class="btn btn-primary" disabled>Seçilenleri uygula (0)</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="app.js?v=20261014c"></script>
</body>
</html>
